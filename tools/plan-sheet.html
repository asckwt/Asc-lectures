<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>الخطة الدراسية · ملف للتحميل</title>
<!-- صفحة تصدير فقط: export-plans.js يفتحها لكل تخصص (?p=acc) ويحفظها صورة و PDF في مجلد plans/ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--navy:#07005E;--yellow:#F7DC6B;--turq:#7DE6D5;--pink:#E980C2;--bg:#F6F5FB;--fg:#151238;--muted:#5B5878;--line:#DEDBEE;
  --k-u:#B9B5D6;--k-f:#4FD1C0;--k-c:#8C86C9;--k-t:#F2C94C;--k-e:#9A97B5;
  --display:"Alexandria","IBM Plex Sans Arabic",sans-serif;--body:"IBM Plex Sans Arabic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{width:1080px;color:var(--fg);font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.code{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-weight:700}
header{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:44px 56px 40px}
header .logo{height:52px;display:block}
header .mark{position:absolute;inset-inline-start:-70px;bottom:-110px;width:380px;opacity:.14}
header h1{position:relative;font-family:var(--display);font-weight:800;font-size:64px;line-height:1.3;margin:30px 0 8px}
.prog{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.prog .pill{display:inline-block;background:var(--yellow);color:var(--navy);font-family:var(--display);font-weight:800;font-size:30px;padding:6px 22px;border-radius:999px}
.prog .en{display:block;margin-top:10px;color:#D9D7F3;font-size:20px;direction:ltr;text-align:right}
.stats{display:flex;gap:12px}
.stat{text-align:center;border:2px solid rgba(255,255,255,.25);border-radius:22px;padding:10px 20px;line-height:1.15}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:50px;color:var(--yellow)}
.stat small{font-size:16px;color:#D9D7F3}
.intro{margin:26px 56px 0}
.intro p{margin:0;font-size:19px;line-height:1.6}
.intro p b{font-family:var(--display)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;list-style:none;margin:12px 56px 0;padding:0;font-size:16px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:18px;height:18px;border-radius:5px;background:var(--k)}
.legend i.e{background:none;border:2px dashed var(--k-e)}
/* الطريق: خط عمودي وعليه رقم كل فصل */
.road{position:relative;margin:22px 40px 0;padding-inline-start:78px}
.road::before{content:"";position:absolute;inset-inline-start:31px;top:30px;bottom:60px;width:4px;border-radius:4px;background:linear-gradient(var(--turq),var(--yellow),var(--pink))}
.sem{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px 18px 18px;margin-bottom:16px;box-shadow:0 10px 24px -20px rgba(7,0,94,.5)}
.sem .num{position:absolute;inset-inline-start:-78px;top:14px;width:66px;height:66px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;border:5px solid var(--bg)}
.sem h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy)}
.sem h2 small{font-family:var(--body);font-weight:500;font-size:16px;color:var(--muted)}
.sem h2 small b{color:var(--navy);font-family:var(--display)}
.bar{height:8px;border-radius:8px;background:#EEECF6;margin:-4px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(270deg,var(--pink),var(--yellow),var(--turq));margin-inline-start:0}
.cs{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px}
.c{position:relative;background:#fff;border:2px solid var(--line);border-inline-start:8px solid var(--k);border-radius:16px;padding:10px 12px;min-height:96px}
.c::before{content:"";position:absolute;inset:0;border-radius:10px;background:var(--k);opacity:.1}
.c .top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:6px}
.c .code{font-size:21px;color:var(--navy)}
.c em{font-style:normal;font-family:var(--display);font-weight:700;font-size:13px;background:var(--navy);color:#fff;border-radius:999px;padding:1px 9px;white-space:nowrap}
.c .nm{position:relative;display:block;font-size:15px;line-height:1.35;margin-top:2px}
.c small{position:relative;display:block;font-size:13px;color:var(--muted);margin-top:5px}
.c small .code{font-size:13px;color:var(--muted)}
.c.e{border-style:dashed}
.c.e .top b{font-family:var(--display);font-size:18px;color:var(--navy)}
.grad{position:relative;display:flex;align-items:center;gap:14px;margin-inline-start:-78px;background:var(--navy);color:#fff;border-radius:24px;padding:16px 20px}
.grad .num{width:66px;height:66px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;flex:none}
.grad .num svg{width:34px;height:34px}
.grad b{font-family:var(--display);font-size:26px}
.grad span{display:block;color:#D9D7F3;font-size:16px}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 40px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px}
.box h3{margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy)}
.box h3 small{font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted)}
.box p{margin:-6px 0 10px;font-size:14.5px;color:var(--muted)}
.box ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.box li{font-size:14px;line-height:1.35}
.box li .code{font-size:15px;color:var(--navy)}
.box li small{display:block;font-size:12.5px;color:var(--muted)}
.box li small .code{font-size:12.5px;color:var(--muted)}
.box li sup{color:var(--pink);font-weight:700}
.chains{margin:26px 40px 0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px 22px}
.chains h2{margin:0 0 14px;font-family:var(--display);font-size:24px;color:var(--navy)}
.chains h2 small{font-family:var(--body);font-weight:500;font-size:16px;color:var(--muted);margin-inline-start:8px}
.lane{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 0;border-top:1px dashed #E6E3F2}
.lane:first-of-type{border-top:0;padding-top:0}
.after{flex:none;font-size:14px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:999px;padding:3px 12px}
.after .code{font-size:14px;color:var(--navy)}
.step{display:flex;align-items:center;gap:8px}
.arr{font-size:22px;font-weight:700;color:#9C96CC}
.cn{min-width:128px;border:2px solid var(--line);border-top:6px solid var(--k);border-radius:14px;padding:6px 12px;background:#FBFAFE;line-height:1.3}
.cn .code{display:block;font-size:18px;color:var(--navy)}
.cn span{display:block;font-size:13.5px}
.cn small{display:block;font-size:12.5px;color:var(--muted)}
.cn small .code{display:inline;font-size:12.5px}
.solo{margin:12px 0 0;font-size:15px;color:var(--muted)}
.solo .code{color:var(--navy)}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:22px 40px 0;padding:22px 26px;background:var(--navy);color:#fff;border-radius:24px}
footer b{font-family:var(--display);font-size:22px;display:block}
footer .site{direction:ltr;font-family:var(--display);font-weight:700;font-size:20px;color:var(--yellow);text-align:right}
footer .qr{flex:none;background:#fff;border-radius:14px;padding:8px;width:128px;height:128px}
footer .qr svg{width:100%;height:100%;display:block}
.src{margin:14px 56px 0;padding-bottom:34px;font-size:13.5px;color:var(--muted);line-height:1.6}
</style></head><body>
<header>
  <img class="logo" src="logo-horizontal-color-on-navy.svg" alt="الطالب الأكاديمي">
  <svg class="mark" viewBox="0 0 160 180" aria-hidden="true"><g transform="translate(10 10)"><path d="M21.12 44.54A9.08 9.08 0 0 0 4.20 49.12L4.20 110.88A9.08 9.08 0 0 0 21.12 115.46L40.48 82.27A4.50 4.50 0 0 0 40.48 77.73Z" fill="#7DE6D5"/><path d="M28.42 40.39A8.99 8.99 0 0 1 40.65 28.06L98.03 60.85A8.00 8.00 0 0 1 94.06 75.80L51.66 75.80A4.50 4.50 0 0 1 47.78 73.57Z" fill="#F7DC6B"/><path d="M28.42 119.61A8.99 8.99 0 0 0 40.65 131.94L98.03 99.15A8.00 8.00 0 0 0 94.06 84.20L51.66 84.20A4.50 4.50 0 0 0 47.78 86.43Z" fill="#E980C2"/></g></svg>
  <h1>الخطة الدراسية</h1>
  <div class="prog"><div><span class="pill" id="title"></span><span class="en" id="en"></span></div>
    <div class="stats"><div class="stat"><b id="nsem"></b><small>فصول</small></div><div class="stat"><b id="hrs"></b><small>ساعة معتمدة</small></div></div></div>
</header>
<div class="intro"><p>طريقك للتخرج <b>فصل بفصل</b>: سجّل مواد كل فصل بالترتيب، وتحت كل مادة مكتوب وش تحتاج قبلها.</p></div>
<ul class="legend" id="legend"></ul>
<div class="road" id="road"></div>
<section class="chains"><h2>تسلسل المواد <small>كل مادة وش تفتح بعدها</small></h2><div id="chains"></div></section>
<div class="extra" id="extra"></div>
<footer><div><b>كل اللي تحتاجه لدراستك في AOUKW</b><span>محاضرات مجانية، نماذج اختبارات وقروبات المواد</span><div class="site">asckwt.com · @asc_kwt</div></div><div class="qr" id="qr"></div></footer>
<p class="src" id="src"></p>
<script src="../plans.js"></script>
<script>
const {C, KIND, PLANS, hrsOf, preOf, lanes} = window.ASC_PLANS;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const plan = PLANS.find(p => p.id === (new URLSearchParams(location.search).get("p") || "acc"));
const KC = {u:"var(--k-u)", f:"var(--k-f)", c:"var(--k-c)", t:"var(--k-t)", e:"var(--k-e)"};
const kindOf = c => c === "UE" || c === "FE" ? "e" : plan.free.includes(c) ? "u" : (plan.map.find(r => r[0] === c) || [, , "e"])[2];
const YEAR = ["الأولى","الثانية","الثالثة","الرابعة"];
const code = c => `<span class="code">${esc(c)}</span>`;
const preText = p => p.split("+").map(g => g.split("|").map(x => x === "EL099" ? "التمهيدي" : code(x)).join(" أو ")).join(" + ");
document.title = "الخطة الدراسية · " + plan.title;
$("title").textContent = "تخصص " + plan.title; $("en").textContent = plan.en; $("hrs").textContent = plan.hrs; $("nsem").textContent = plan.sem.length;
$("legend").innerHTML = ["u","f","c","t","e"].filter(k => plan.sem.flat().some(c => kindOf(c) === k)).map(k =>
  `<li><i class="${k === "e" ? "e" : ""}" style="--k:${KC[k]}"></i>${k === "e" ? "اختياري (تختار من القائمة تحت)" : KIND[k]}</li>`).join("");
let done = 0;
$("road").innerHTML = plan.sem.map((s, i) => {
  const h = s.reduce((a, c) => a + hrsOf(plan, c), 0); done += h;
  return `<section class="sem"><div class="num">${i + 1}</div>
    <h2>السنة ${YEAR[i >> 1]} · الفصل ${i % 2 ? "الثاني" : "الأول"}<small><b>${h}</b> ساعة · أنجزت <b>${done}</b> من ${plan.hrs}</small></h2>
    <div class="bar"><i style="width:${done / plan.hrs * 100}%"></i></div>
    <div class="cs" style="--cols:${s.length > 4 ? 3 : Math.max(s.length, 2)}">${s.map(c => {
      if (c === "UE" || c === "FE") return `<div class="c e" style="--k:${KC.e}"><div class="top"><b>${c === "UE" ? "اختياري جامعة" : "اختياري كلية"}</b><em>${hrsOf(plan, c)} س.م</em></div><span class="nm">تختار مادة من القائمة تحت</span></div>`;
      const pre = preOf(plan, c);
      return `<div class="c" style="--k:${KC[kindOf(c)]}"><div class="top">${code(c)}<em>${C[c][2]} س.م</em></div><span class="nm">${esc(C[c][1])}</span><small>${pre ? "يحتاج: " + preText(pre) : "بدون متطلب"}</small></div>`;
    }).join("")}</div></section>`;
}).join("") + `<div class="grad"><div class="num"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/><path d="M22 9v6"/></svg></div><div><b>مبروك التخرج!</b><span>${plan.hrs} ساعة معتمدة · ${esc(plan.en)}</span></div></div>`;
{
  const {lanes: ls, solo, by, gate} = lanes(plan);
  const KCm = {...KC, p:"var(--pink)"};
  const node = (c, i, l) => {
    const n = by[c], extra = i ? n.groups.filter(g => !g.includes(l[i - 1])) : [], more = n.kids.filter(k => k !== l[i + 1]);
    return `<div class="step">${i ? '<span class="arr">←</span>' : ""}<div class="cn" style="--k:${KCm[n.kind]}">${code(c)}<span>${esc(C[c][1])}</span>${extra.length ? `<small>+ يحتاج ${extra.map(g => g.map(code).join(" أو ")).join(" + ")}</small>` : ""}${more.length ? `<small>ويفتح: ${more.map(code).join("، ")}</small>` : ""}</div></div>`;
  };
  const startOf = c => by[c].groups.length ? preText(by[c].groups.map(g => g.join("|")).join("+")) : "البداية";
  $("chains").innerHTML = `<div class="lane"><span class="after">ابدأ من هني</span>${gate.map((c, i) => node(c, i, gate)).join("")}</div>` +
    ls.map(l => `<div class="lane"><span class="after">بعد ${startOf(l[0])}</span>${l.map((c, i) => node(c, i, l)).join("")}</div>`).join("") +
    (solo.length ? `<p class="solo">مواد ما تفتح غيرها، تاخذها أي وقت: ${solo.map(code).join("، ")}</p>` : "");
}
const item = ([c, pre, star]) => `<li>${code(c)}${star ? "<sup>*</sup>" : ""}<small>${esc(C[c][1])}${pre ? " · يحتاج " + preText(pre) : ""}</small></li>`;
$("extra").innerHTML = `
  <div class="box"><h3>اختياري جامعة <small>· تختار مادة وحدة (3 ساعات)</small></h3><ul>${plan.ue.map(item).join("")}</ul></div>
  <div class="box"><h3>اختياري كلية <small>· ${plan.id === "itc" ? "تختار مادتين (6 ساعات)" : plan.id === "eco" ? "4 ساعات" : "تختار مادة وحدة (" + plan.fe.hrs + " ساعات)"}</small></h3>${plan.fe.note && plan.id !== "itc" ? `<p>${esc(plan.fe.note)}</p>` : ""}<ul>${plan.fe.list.map(item).join("")}</ul></div>`;
$("src").textContent = `المصدر: ${plan.srcNote} من موقع الجامعة العربية المفتوحة، وتوزيع الفصول ${plan.semNote}. تقدر تغيّر الترتيب حسب المطروح كل فصل، بس لازم تخلص المتطلب قبل المادة. الأسماء العربية ترجمة تقريبية؛ تأكد من مرشدك الأكاديمي قبل التسجيل. تحديث أكتوبر 2026.`;
if (window.QR_SVG) $("qr").innerHTML = window.QR_SVG;
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body></html>
