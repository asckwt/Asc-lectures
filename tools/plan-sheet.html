<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>الخطة الدراسية · ملف للتحميل</title>
<!-- صفحة تصدير فقط: export-plans.js يفتحها لكل تخصص (?p=acc) ويحفظها صورة و PDF في مجلد plans/ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--navy:#07005E;--yellow:#F7DC6B;--turq:#7DE6D5;--pink:#E980C2;--bg:#F6F5FB;--fg:#151238;--muted:#5B5878;--line:#D9D6EA;
  --k-p:#E980C2;--k-u:#B9B5D6;--k-f:#4FD1C0;--k-c:#8C86C9;--k-t:#F2C94C;--k-e:#9A97B5;
  --display:"Alexandria","IBM Plex Sans Arabic",sans-serif;--body:"IBM Plex Sans Arabic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{width:1080px;color:var(--fg);font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.code{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-weight:700}
header{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:44px 56px 40px}
header .logo{height:52px;display:block}
header .mark{position:absolute;inset-inline-start:-70px;bottom:-110px;width:380px;opacity:.14}
header h1{position:relative;font-family:var(--display);font-weight:800;font-size:64px;line-height:1.3;margin:30px 0 8px}
.prog{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.prog .pill{display:inline-block;background:var(--yellow);color:var(--navy);font-family:var(--display);font-weight:800;font-size:30px;padding:6px 22px;border-radius:999px}
.prog .en{display:block;margin-top:10px;color:#D9D7F3;font-size:20px;direction:ltr;text-align:right}
.hrs{text-align:center;border:2px solid rgba(255,255,255,.25);border-radius:22px;padding:10px 22px;line-height:1.15}
.hrs b{display:block;font-family:var(--display);font-weight:800;font-size:54px;color:var(--yellow)}
.hrs small{font-size:17px;color:#D9D7F3}
.how{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 56px 6px;font-size:17px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;list-style:none;margin:0;padding:0 56px 6px;font-size:16px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:18px;height:18px;border-radius:5px;background:var(--k);display:inline-block}
.legend i.e{background:none;border:2px dashed var(--k-e)}
.legend i.or{width:30px;height:0;border-radius:0;border-top:3px dashed var(--muted);background:none}
.chart{position:relative;margin:14px 40px 0;padding:10px 0 18px;background:#fff;border:1px solid var(--line);border-radius:28px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart path{fill:none;stroke:#9C96CC;stroke-width:2.6}
.chart path.or{stroke-dasharray:7 6}
.row{position:relative;display:flex;align-items:center;gap:0;padding:14px 0}
.row+.row{border-top:1px dashed #ECEAF5}
.st{flex:none;width:74px;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);line-height:1.25}
.st b{display:block;font-size:28px;color:var(--navy)}
.nodes{flex:1;display:flex;justify-content:center;gap:var(--gap);padding-inline-end:20px}
.n{position:relative;z-index:1;width:var(--w);min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:#fff;border:2.5px solid var(--k);border-radius:18px;padding:12px 6px 10px;box-shadow:0 8px 18px -14px rgba(7,0,94,.5)}
.n::before{content:"";position:absolute;inset:0;border-radius:15px;background:var(--k);opacity:.13}
.n .code{position:relative;font-size:var(--fs);color:var(--navy)}
.n span{position:relative;font-size:13.5px;line-height:1.35;color:var(--muted);margin-top:3px}
.n em{position:absolute;top:-12px;inset-inline-start:10px;font-style:normal;font-family:var(--display);font-weight:700;font-size:12.5px;background:var(--navy);color:#fff;border-radius:999px;padding:1px 9px}
.n.e{border-style:dashed}
.extra{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 40px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px}
.box h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy)}
.box h2 small{font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted)}
.box p{margin:2px 0 10px;font-size:14.5px;color:var(--muted)}
.box ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.box ul.two{grid-template-columns:1fr 1fr;column-gap:14px}
.box li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:15px;border-bottom:1px solid #F0EEF7;padding-bottom:6px}
.box li:last-child{border:0;padding:0}
.box li .code{font-size:15.5px;color:var(--navy)}
.box li small{display:block;font-size:12.5px;color:var(--muted)}
.box li sup{color:var(--pink);font-weight:700}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:22px 40px 0;padding:22px 26px;background:var(--navy);color:#fff;border-radius:24px}
footer b{font-family:var(--display);font-size:22px;display:block}
footer .site{direction:ltr;font-family:var(--display);font-weight:700;font-size:20px;color:var(--yellow)}
footer .qr{flex:none;background:#fff;border-radius:14px;padding:8px;width:128px;height:128px}
footer .qr svg{width:100%;height:100%;display:block}
.src{margin:14px 56px 0;padding-bottom:34px;font-size:13.5px;color:var(--muted);line-height:1.6}
</style></head><body>
<header>
  <img class="logo" src="logo-horizontal-color-on-navy.svg" alt="الطالب الأكاديمي">
  <svg class="mark" viewBox="0 0 160 180" aria-hidden="true"><g transform="translate(10 10)"><path d="M21.12 44.54A9.08 9.08 0 0 0 4.20 49.12L4.20 110.88A9.08 9.08 0 0 0 21.12 115.46L40.48 82.27A4.50 4.50 0 0 0 40.48 77.73Z" fill="#7DE6D5"/><path d="M28.42 40.39A8.99 8.99 0 0 1 40.65 28.06L98.03 60.85A8.00 8.00 0 0 1 94.06 75.80L51.66 75.80A4.50 4.50 0 0 1 47.78 73.57Z" fill="#F7DC6B"/><path d="M28.42 119.61A8.99 8.99 0 0 0 40.65 131.94L98.03 99.15A8.00 8.00 0 0 0 94.06 84.20L51.66 84.20A4.50 4.50 0 0 0 47.78 86.43Z" fill="#E980C2"/></g></svg>
  <h1>الخطة الدراسية</h1>
  <div class="prog"><div><span class="pill" id="title"></span><span class="en" id="en"></span></div>
    <div class="hrs"><b id="hrs"></b><small>ساعة معتمدة</small></div></div>
</header>
<div class="how"><span>ابدأ من فوق ونزّل: كل مادة تنفتح لك بعد ما تخلص المواد المتصلة فيها من فوق.</span></div>
<ul class="legend" id="legend"></ul>
<div class="chart" id="chart"><svg id="lines" aria-hidden="true"></svg></div>
<div class="extra" id="extra"></div>
<footer><div><b>كل اللي تحتاجه لدراستك في AOUKW</b><span>محاضرات مجانية، نماذج اختبارات وقروبات المواد</span><div class="site">asckwt.com · @asc_kwt</div></div><div class="qr" id="qr"></div></footer>
<p class="src" id="src"></p>
<script src="../plans.js"></script>
<script>
const {C, KIND, PLANS, layout} = window.ASC_PLANS;
const id = new URLSearchParams(location.search).get("p") || "acc";
const plan = PLANS.find(p => p.id === id);
const {nodes, by, cols} = layout(plan);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const KC = {p:"var(--k-p)", u:"var(--k-u)", f:"var(--k-f)", c:"var(--k-c)", t:"var(--k-t)", e:"var(--k-e)"};
const preText = p => p.split("+").map(g => g.split("|").map(c => `<span class="code">${esc(c)}</span>`).join(" أو ")).join(" + ");
document.title = "الخطة الدراسية · " + plan.title;
$("title").textContent = "تخصص " + plan.title; $("en").textContent = plan.en; $("hrs").textContent = plan.hrs;
$("legend").innerHTML = ["p","u","f","c","t","e"].filter(k => nodes.some(n => n.kind === k)).map(k =>
  `<li><i class="${k === "e" ? "e" : ""}" style="--k:${KC[k]}"></i>${KIND[k]}</li>`).join("") + `<li><i class="or"></i>متطلب بديل (أو)</li>`;
// عرض البطاقة حسب أكثر صف فيه مواد
const most = Math.max(...cols.map(c => c.length)), gap = 14, room = 1000 - 74 - 20 - 20;
const w = Math.min(176, Math.floor((room - gap * (most - 1)) / most));
$("chart").style.cssText = `--w:${w}px;--gap:${gap}px;--fs:${w < 128 ? 19 : 22}px`;
$("chart").insertAdjacentHTML("beforeend", cols.map((col, i) => `<div class="row"><div class="st">${i ? `<b>${i}</b>المرحلة` : "البداية"}</div><div class="nodes">${col.map(n =>
  `<div class="n ${n.kind === "e" ? "e" : ""}" data-c="${esc(n.code)}" style="--k:${KC[n.kind]}">${C[n.code][2] ? `<em>${C[n.code][2]} س.م</em>` : ""}<b class="code">${esc(n.code)}</b><span>${esc(C[n.code][1])}</span></div>`).join("")}</div></div>`).join(""));
const item = ([c, pre, star]) => `<li><div><span class="code">${esc(c)}</span>${star ? "<sup>*</sup>" : ""}<small>${esc(C[c][1])}</small></div><small>${pre ? "متطلب: " + preText(pre) : ""}</small></li>`;
$("extra").innerHTML = `
  <div class="box"><h2>من أول فصل</h2><p>متطلبات جامعة إجبارية بدون متطلب سابق.</p><ul>${plan.free.map(c => item([c, ""])).join("")}</ul></div>
  <div class="box"><h2>اختياري جامعة <small>· 3 ساعات</small></h2><p>تختار مادة وحدة.</p><ul class="${plan.ue.length > 6 ? "two" : ""}">${plan.ue.map(item).join("")}</ul></div>
  <div class="box"><h2>اختياري كلية <small>· ${plan.fe.hrs} ساعات</small></h2>${plan.fe.note ? `<p>${esc(plan.fe.note)}</p>` : ""}<ul>${plan.fe.list.map(item).join("")}</ul></div>`;
$("src").textContent = `المصدر: ${plan.srcNote} من موقع الجامعة العربية المفتوحة. الأسماء العربية ترجمة تقريبية، والمراحل ترتيب حسب المتطلبات مو جدول فصول رسمي؛ تأكد من مرشدك الأكاديمي قبل التسجيل. تحديث أكتوبر 2026.`;
if (window.QR_SVG) $("qr").innerHTML = window.QR_SVG;
function draw() {
  const box = $("chart").getBoundingClientRect(), r = c => $("chart").querySelector(`.n[data-c="${CSS.escape(c)}"]`).getBoundingClientRect();
  $("lines").setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
  $("lines").innerHTML = nodes.flatMap(n => n.groups.flatMap(g => g.filter(p => by[p]).map(p => {
    const a = r(p), b = r(n.code);
    const x1 = a.left + a.width / 2 - box.left, y1 = a.bottom - box.top, x2 = b.left + b.width / 2 - box.left, y2 = b.top - box.top, my = (y1 + y2) / 2;
    return `<path class="${g.length > 1 ? "or" : ""}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`;
  }))).join("");
}
document.fonts.ready.then(() => { draw(); document.body.dataset.ready = "1"; });
</script>
</body></html>
