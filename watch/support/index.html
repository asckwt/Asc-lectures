<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://asc-videos.m7mdaltalab.workers.dev http://localhost:*"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>الشكاوي والاقتراحات | الطالب الأكاديمي</title>
<meta name="description" content="أرسل شكوى أو اقتراح أو مشكلة تقنية، وتابع الرد.">
<meta name="theme-color" content="#07005E">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../app.css">
<style>
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:0;margin:0;padding:0}
.kinds label{display:flex;align-items:center;gap:8px;min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;font-weight:600}
.kinds input{position:absolute;opacity:0;width:1px;height:1px}
.kinds label:has(input:checked){border-color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.kinds label:has(input:focus-visible){outline:2px solid var(--turq)}
.tk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.tk .reply{background:var(--soft-t);border-radius:12px;padding:8px 12px;font-size:14px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.st.open{background:var(--soft-y);color:#8A5A00}.st.working{background:var(--soft-p);color:var(--ink-p)}.st.solved{background:var(--soft-t);color:var(--ink-t)}
</style>
</head><body>
<header class="top"><div class="wrap">
  <div class="bar" id="bar"></div>
  <h1 id="title">الشكاوي والاقتراحات</h1>
  <p class="lead" id="lead">قول لنا شنو اللي ما عجبك أو شنو تبي نضيف، ونرد عليك هني.</p>
</div></header>
<main class="wrap">
  <p class="card" id="login" hidden style="margin:0">سجّل دخولك أول من <a href="../">صفحة المحاضرات</a> عشان ترسل لنا.</p>
  <form class="card" id="f" style="display:grid;gap:14px" novalidate hidden>
    <h2 style="margin:0">رسالة جديدة</h2>
    <fieldset class="kinds"><legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">نوع الرسالة</legend>
      <label><input type="radio" name="kind" value="suggestion" checked>💡 اقتراح</label>
      <label><input type="radio" name="kind" value="complaint">😕 شكوى</label>
      <label><input type="radio" name="kind" value="tech">🛠️ مشكلة تقنية</label>
      <label><input type="radio" name="kind" value="payment">💳 الدفع والاشتراك</label>
    </fieldset>
    <label>المادة (اختياري)<select name="course"><option value="">بدون</option></select></label>
    <label>رسالتك<textarea name="message" rows="4" maxlength="2000" required placeholder="اكتب بالتفصيل، مثلاً: الفيديو يوقف عندي بالآيفون بالمحاضرة 3"></textarea></label>
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn" type="submit">أرسل</button>
  </form>
  <section class="card" id="mine" hidden><h2>رسايلك</h2><div id="list" style="display:grid;gap:10px"></div></section>
  <section class="card" id="rates" hidden><h2>تقييماتك</h2><div id="rlist" style="display:grid;gap:10px"></div></section>
</main>
<footer><div class="wrap"><a href="../../">الطالب الأكاديمي</a> · <a href="../../privacy/">الخصوصية</a></div></footer>
<script src="../app.js"></script>
<script src="support.js"></script>
</body></html>
