<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://asc-videos.m7mdaltalab.workers.dev http://localhost:*"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>اسأل الأستاذ | الطالب الأكاديمي</title>
<meta name="theme-color" content="#07005E">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../app.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh}
.chead{background:var(--navy);color:#fff;padding:10px 0}
.chead .wrap{display:flex;align-items:center;gap:12px;max-width:760px}
.chead a.back{color:#fff;text-decoration:none;font-size:22px;width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.chead .av{width:40px;height:40px;border-radius:50%;background:var(--turq);color:#07005E;display:grid;place-items:center;font:700 15px var(--display);flex:none}
.chead b{display:block;font:700 16px var(--display)}
.chead small{color:#D9D7F3}
#log{flex:1;overflow-y:auto;padding:16px 0}
#log .wrap{max-width:760px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(80%,520px);border-radius:18px;padding:10px 14px;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--navy);color:#fff;border-end-end-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m.me{background:#2A1FB0}}
.m.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.m .who{display:block;font:700 12px var(--display);color:var(--ink-p)}
.m p{margin:0;white-space:pre-wrap}
.m time{display:block;text-align:left;font-size:11px;opacity:.7}
.m img{display:block;max-width:100%;max-height:340px;border-radius:12px;background:#fff;cursor:zoom-in;min-height:60px;min-width:80px}
.empty{align-self:center;text-align:center;color:var(--muted);max-width:340px;margin-top:40px}
form#send{background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
form#send .wrap{max-width:760px;display:grid;gap:8px}
.pv{display:flex;align-items:center;gap:8px;background:var(--soft-t);color:var(--ink-t);border-radius:12px;padding:6px 8px;font-size:13px}
.pv img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.pv button{margin-inline-start:auto;width:44px;height:44px;border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer}
.in{display:flex;align-items:flex-end;gap:8px}
.in textarea{resize:none;min-height:46px;max-height:140px;border-radius:14px}
.in .go{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:var(--navy);color:var(--yellow);font-size:20px;cursor:pointer}
.in .go span{display:inline-block;transform:scaleX(-1)}
.att{justify-self:start;min-height:44px;border:1.5px dashed var(--accent-ink);background:transparent;color:var(--accent-ink);border-radius:12px;padding:8px 14px;font:700 14px var(--display);cursor:pointer}
</style>
</head><body>
<header class="chead"><div class="wrap">
  <a class="back" href="../" aria-label="رجوع">→</a>
  <span class="av" id="av" aria-hidden="true">؟</span>
  <div style="flex:1;min-width:0"><b id="who">الأستاذ</b><small id="sub"></small></div>
</div></header>
<div id="log" aria-live="polite"><div class="wrap" id="msgs"></div></div>
<form id="send" novalidate><div class="wrap">
  <div class="pv" id="pv" hidden><img id="pv-img" alt="الصورة المختارة"><span id="pv-name"></span><button type="button" id="pv-x" aria-label="شيل الصورة">✕</button></div>
  <p class="msg" id="msg" role="alert"></p>
  <div class="in">
    <label style="flex:1"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">رسالتك</span><textarea id="text" rows="1" maxlength="2000" placeholder="اكتب سؤالك للأستاذ"></textarea></label>
    <button class="go" type="submit" aria-label="أرسل"><span>➤</span></button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <button class="att" type="button" id="att">📎 أرفق صورة حلّك</button>
</div></form>
<script src="../app.js"></script>
<script src="chat.js"></script>
</body></html>
