const TOTAL='٦٤ سؤال',KEY='buc111q',L='ABCDEFGHIJ';
const list=document.getElementById('list'),score=document.getElementById('score');
let picks={};try{picks=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(picks))}catch(e){}}
function render(){
 list.innerHTML='';
 DATA.forEach((c,ci)=>{
  const sec=document.createElement('section');sec.dataset.c=ci;
  sec.innerHTML=`<h2 class="ch"><i>${c.tag}</i>${c.title}</h2>`;
  let last='',num=0;
  c.qs.forEach((q,qi)=>{
   if(q.s!==last){last=q.s;num=0;const h=document.createElement('h3');h.className='sub';h.textContent=q.s;sec.appendChild(h)}
   num++;
   const id=ci+'-'+qi,d=document.createElement('div');d.className='q';d.dataset.i=qi;
   d.innerHTML=`<div class="qe"><span class="n">${q.t==='m'?num:'Q'+num}</span><div></div></div><div class="qa"></div><div class="os"></div><div class="res"></div>`;
   d.querySelector('.qe div').textContent=q.en;d.querySelector('.qa').textContent=q.ar;
   const os=d.querySelector('.os');
   if(q.t==='m'){
    d.classList.add('m');os.style.display='block';
    const s=document.createElement('select');s.className='sel';
    s.innerHTML='<option value="">اختر التعريف…</option>';
    c.defs.forEach((t,k)=>{const o=document.createElement('option');o.value=k;o.textContent=L[k]+') '+t;s.appendChild(o)});
    s.onchange=()=>{if(s.value==='')return;const k=+s.value;picks[id]=k;save();mark(d,q,k);tally()};
    os.appendChild(s);
   }else q.o.forEach((t,k)=>{const b=document.createElement('button');b.className='o';b.innerHTML=`<span class="l">${L[k]}</span><span></span>`;b.lastChild.textContent=t;b.onclick=()=>{picks[id]=k;save();mark(d,q,k);tally()};os.appendChild(b)});
   if(id in picks)mark(d,q,picks[id]);
   sec.appendChild(d);
  });
  list.appendChild(sec);
 });
 tally();
}
function mark(d,q,k){
 d.classList.add('done');
 if(q.t==='m'){const s=d.querySelector('.sel');s.value=k===null?q.k:k;s.disabled=true;d.classList.add(k===null||k===q.k?'ok':'bad')}
 else d.querySelectorAll('.o').forEach((b,i)=>{b.disabled=true;if(i===q.k)b.classList.add('ok');else if(i===k)b.classList.add('bad')});
 const r=d.querySelector('.res');
 r.innerHTML=k===null?'<span class="y">✓ الإجابة: </span>':(k===q.k?'<span class="y">✓ صح! </span>':'<span class="x">✗ الإجابة الصحيحة: </span>');
 if(q.t==='m'){const e=document.createElement('bdi');e.dir='ltr';e.textContent=q.ans;r.append(e)}else r.append(q.ans);
}
function tally(){
 const n=Object.keys(picks).length,ok=Object.entries(picks).filter(([id,k])=>{const[c,q]=id.split('-');return DATA[c].qs[q].k===k}).length;
 score.innerHTML=n?`<b>${ok}</b> / ${n} صح`:TOTAL;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===t));
 document.querySelectorAll('section').forEach(s=>s.hidden=t.dataset.c!=='all'&&s.dataset.c!==t.dataset.c);
});
document.getElementById('show').onclick=()=>document.querySelectorAll('section').forEach(s=>s.querySelectorAll('.q').forEach(d=>{if(!d.classList.contains('done'))mark(d,DATA[s.dataset.c].qs[d.dataset.i],null)}));
document.getElementById('reset').onclick=()=>{picks={};save();render();scrollTo(0,0)};
render();
