earch type tests hypotheses about cause-and-effect relationships?", "ar": "أي نوع من البحث يختبر فرضيات عن علاقات السبب والنتيجة؟", "o": ["Exploratory", "Descriptive", "Causal", "Observational"], "k": 2, "ans": "البحث السببي"}, {"t": "q", "s": "أسئلة إضافية من الشرح · اختيار من متعدد", "en": "Information collected for the specific purpose at hand is called:", "ar": "المعلومات اللي تنجمع للغرض الحالي بالتحديد تسمى:", "o": ["Secondary data", "Primary data", "Big Data", "Internal data"], "k": 1, "ans": "البيانات الأولية"}, {"t": "q", "s": "أسئلة إضافية من الشرح · اختيار من متعدد", "en": "Which is a disadvantage of secondary data?", "ar": "أي مما يلي من عيوب البيانات الثانوية؟", "o": ["Lower cost", "Obtained quickly", "Data may not be current", "Easy to find"], "k": 2, "ans": "ممكن ما تكون حديثة"}, {"t": "q", "s": "أسئلة إضافية من الشرح · اختيار من متعدد", "en": "Trained observers studying consumers in their natural settings, such as visiting families at home, is:", "ar": "مراقبون مدرّبون يدرسون المستهلكين في بيئتهم الطبيعية، مثل زيارة العائلات في بيوتهم، هذا:", "o": ["Survey research", "Ethnographic research", "Experimental research", "Telephone interviews"], "k": 1, "ans": "البحث الإثنوغرافي"}, {"t": "q", "s": "أسئلة إضافية من الشرح · اختيار من متعدد", "en": "Testing different ads with two groups to compare the effects is:", "ar": "اختبار إعلانات مختلفة على مجموعتين لمقارنة التأثير هو:", "o": ["Observational research", "Survey research", "Experimental research", "Ethnographic research"], "k": 2, "ans": "البحث التجريبي"}, {"t": "q", "s": "أسئلة إضافية من الشرح · اختيار من متعدد", "en": "Which contact method is low-cost and gets honest answers, but is slow with a low response rate?", "ar": "أي طريقة اتصال تكلفتها قليلة وإجاباتها صادقة، بس بطيئة ونسبة الرد فيها قليلة؟", "o": ["Mail questionnaires", "Telephone interviews", "Personal interviews", "Focus groups"], "k": 0, "ans": "الاستبيانات البريدية"}, {"t": "q", "s": "أسئلة إضافية من الشرح · اختيار من متعدد", "en": "What const TOTAL='٣٤ سؤال',KEY='mkt112q',L='ABCDEFGHIJ';
const list=document.getElementById('list'),score=document.getElementById('score');

function save(){try{localStorage.setItem(KEY,JSON.stringify(picks))}catch(e){}}
function render(){
 list.innerHTML='';
 DATA.forEach((c,ci)=>{
  const sec=document.createElement('section');sec.dataset.c=ci;
  sec.innerHTML=`<h2 class="ch"><i>${c.tag}</i>${c.title}</h2>`;
  let last='',num=0;
  c.qs.forEach((q,qi)=>{
   if(q.s!==last){last=q.s;num=0;const h=document.createElement('h3');h.className='sub';h.textContent=q.s;sec.appendChild(h)}
   num++;
   const id=ci+'-'+qi,d=document.createElement('div');d.className='q';d.dataset.i=qi;
   d.innerHTML=`<div class="qe"><span class="n">${q.t==='m'?num:'Q'+num}</span><div></div></div><div class="qa"></div><div class="os"></div><div class="res"></div>`;
   d.querySelector('.qe div').textContent=q.en;d.querySelector('.qa').textContent=q.ar;

   if(q.t==='m'){
    d.classList.add('m');os.style.display='block';
    const s=document.createElement('select');s.className='sel';
    s.innerHTML='<option value="">اختر التعريف…</option>';

function mark(d,q,k){
 d.classList.add('done');
 if(q.t==='m'){const s=d.querySelector('.sel');s.value=k===null?q.k:k;s.disabled=true;d.classList.add(k===null||k===q.k?'ok':'bad')}

function tally(){
 const n=Object.keys(picks).length,ok=Object.entries(picks).filter(([id,k])=>{const[c,q]=id.split('-');return DATA[c].qs[q].k===k}).length;
 score.innerHTML=n?`<b>${ok}</b> / ${n} صح`:TOTAL;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===t));
 document.querySelectorAll('section').forEach(s=>s.hidden=t.dataset.c!=='all'&&s.dataset.c!==t.dataset.c);
});
document.getElementById('show').onclick=()=>document.querySelectorAll('section').forEach(s=>s.querySelectorAll('.q').forEach(d=>{if(!d.classList.contains('done'))mark(d,DATA[s.dataset.c].qs[d.dataset.i],null)}));
document.getElementById('reset').onclick=()=>{picks={};save();render();scrollTo(0,0)};
render();
</script>
<script src="../quiz-plus.js"></script>
</body></html>
