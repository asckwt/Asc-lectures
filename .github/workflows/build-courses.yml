# يبني صفحات المواد (c/) وملفات التقويم (ics/) و sitemap.xml ومعلومات مساعد الذكاء الاصطناعي (ai/kb) من جديد كل ما تغيّر index.html أو plans.js
name: Build course pages
on:
  push:
    branches: [main]
    paths: [index.html, plans.js, tools/build-courses.js, tools/build-ai.js, ai/facts.md, "ai/books/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/build-courses.js
      - run: node tools/build-ai.js
      - name: Commit if changed
        run: |
          git add -A c ics sitemap.xml ai/kb ai/config.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild course pages"
          git push
